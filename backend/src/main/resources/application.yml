server:
  port: 8080

spring:
  application:
    name: badoki
  datasource:
    # PostgreSQL — با docker-compose بالا می‌آید:
    #   docker compose up -d
    url: jdbc:postgresql://localhost:5432/badoki
    username: badoki
    password: badoki
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:artor906@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: "Badoki-Super-Secret-Key-For-Dev-2026-xQ7wE9!@#$%^&*()_+Badoki"
    # مدت اعتبار توکن: ۷ روز
    expiration-ms: 604800000
  otp:
    expiry-minutes: 5
    resend-cooldown-seconds: 60
    # اگر true باشد (یا ایمیل تنظیم نشده باشد)، کد در پاسخ API و لاگ برگردانده می‌شود — فقط برای توسعه
    dev-mode: ${OTP_DEV_MODE:true}
  scheduler:
    expire-cron: "0 15 0 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.security: WARN
